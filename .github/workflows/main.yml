  image-scan:
    name: Docker image Scan
    runs-on: ubuntu-latest  

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: setup docker
      uses: docker-practice/actions-setup-docker@v1
      with:
        docker_version: '20.10'
    - name: docker build
      run: docker build -f Dockerfile -t myapp:latest .
    - name: docker scout scan
      #run:
      #  curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh
      #  echo ${{secrets.dockerpass}} | docker login -u ${{secrets.dockeruser}} --password-stdin
      #  docker scout quickview
      # docker scout cves
      uses: docker/scout-action@v1.24.0
      with:
        dockerhub-user: ${{secrets.dockeruser}}
        dockerhub-password: ${{secrets.dockerpass}} 
        commnd: quickview, cves
        only-severities: critical, high        
        sarif-file: scout-report.sarif
    - name: upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with: 
       name: docker scout findings
       path: scout-report.sarif
        
        
      
      
  
        
